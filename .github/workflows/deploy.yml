name: 🏆 Deploy FIFA World Cup 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to Vercel
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🚀 Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          npm install -g vercel@latest
          vercel deploy --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --prod --yes \
            --name "fifa-worldcup-2026" \
            2>&1 | tee deploy_output.txt
          echo ""
          echo "🌐 Live URL:"
          grep -E "https://.*vercel\.app" deploy_output.txt | tail -1
